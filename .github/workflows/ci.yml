name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build

      - name: Generate six canonical acceptance apps
        run: npm run generate:acceptance

      - name: Benchmark independent generated-app installs, checks and builds
        run: npm run benchmark:acceptance

      - name: Build real-business acceptance app from mixed source pack
        run: npm run acceptance:real-business

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - name: Verify generated real-business app in Chromium
        run: npm run test:e2e:real-business
