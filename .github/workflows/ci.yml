name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - run: npm run generate:acceptance

      - name: Install marketing acceptance app
        run: npm install --no-audit --no-fund
        working-directory: .tmp/generated-acceptance-marketing
      - name: Check marketing acceptance app
        run: npm run check
        working-directory: .tmp/generated-acceptance-marketing
      - name: Build marketing acceptance app
        run: npm run build
        working-directory: .tmp/generated-acceptance-marketing

      - name: Install B2B acceptance app
        run: npm install --no-audit --no-fund
        working-directory: .tmp/generated-acceptance-b2b
      - name: Check B2B acceptance app
        run: npm run check
        working-directory: .tmp/generated-acceptance-b2b
      - name: Build B2B acceptance app
        run: npm run build
        working-directory: .tmp/generated-acceptance-b2b

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
