name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A PR only needs proof for its newest head. If another commit lands while the
# previous head is still installing browsers or starting Supabase, cancel that
# obsolete run rather than spending several more minutes proving code that can
# no longer be merged. Pushes to main and manual runs keep unique groups so
# release/history evidence is never cancelled by this optimisation.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build

      # Product failure and evidence-system failure are different outcomes.
      # This command exits non-zero only when a registered deterministic check
      # is missing, malformed, wrong-build or otherwise unresolved; a correctly
      # measured below-threshold product gate stays a truthful product result.
      - name: Resolve registered deterministic gate evidence
        run: npm run gates:evidence

      - name: Generate six canonical acceptance apps
        run: npm run generate:acceptance

      - name: Benchmark independent generated-app installs, checks and builds
        run: npm run benchmark:acceptance

      - name: Build synthetic mixed-source regression app
        run: npm run acceptance:synthetic-mixed-source

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - name: Accessibility gate for canonical generated app
        run: npm run test:e2e:accessibility

      - name: Verify synthetic mixed-source generated app in Chromium
        run: npm run test:e2e:synthetic-mixed-source

      # Targeted cross-engine portability, and only here: the other browsers are
      # installed for one bounded lane rather than for the whole suite, because
      # a layout that breaks in Safari is a factory defect and finding it once
      # is cheaper than finding it per project.
      - run: npx playwright install --with-deps firefox webkit

      - name: Cross-browser visual portability smoke
        run: npm run test:e2e:portability

      # Advisory, and deliberately so: §8 of docs/VISUAL_EXCELLENCE.md asks for
      # real corpus evidence before any threshold exists. It reads the builds
      # the steps above already produced and never regenerates one.
      - name: Cross-build anti-template diagnostic
        run: npm run diagnose:anti-template

      - name: Publish cross-browser portability evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cross-browser-portability-evidence
          path: .app-builder/portability
          if-no-files-found: warn
          retention-days: 14

      - name: Publish anti-template diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: anti-template-diagnostic
          path: .app-builder/anti-template
          if-no-files-found: warn
          retention-days: 14

  # Stage Q8. Its own job because each mutation costs a full run of the target's tests, and its own
  # job rather than a step inside `verify` so the several minutes it takes are spent in parallel
  # rather than in front of everything else.
  mutation-strength:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund

      - name: Mutation strength of the safety logic
        run: npm run mutation:strength

      - name: Publish mutation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-strength-report
          path: .app-builder/mutation-strength
          if-no-files-found: warn
          retention-days: 14

  database-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund

      # Stage Q12. Runs against a disposable local PostgreSQL cluster rather than the Supabase
      # stack below, because proving that a dump restores is a database question rather than a
      # provider one - and a recovery gate that needs a cloud project is a gate nobody runs.
      - name: Executable backup/restore acceptance
        run: npm run acceptance:data-recovery

      - name: Publish restore-rehearsal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: data-recovery-evidence
          path: .app-builder/data-recovery
          if-no-files-found: warn
          retention-days: 14

      - name: Generate canonical Supabase-backed app
        run: npm run generate:acceptance

      - name: Initialise isolated Supabase acceptance project
        run: |
          mkdir -p .tmp/supabase-rls-acceptance
          npx --yes supabase@2.115.0 init --workdir .tmp/supabase-rls-acceptance
          npm run acceptance:supabase-rls:prepare

      # `storage-api` is started here and the other excluded services are not.
      # The organisation-files capability is the first thing in this repository
      # that needs real object storage, and a journey that uploads to a mock
      # would prove nothing about the policies it is meant to exercise. One
      # extra container, added because a specific test needs it.
      - name: Start local Supabase for RLS acceptance
        run: npx --yes supabase@2.115.0 start --workdir .tmp/supabase-rls-acceptance -x studio,imgproxy,mailpit,realtime,postgres-meta,edge-runtime,logflare,vector,supavisor

      - name: Execute pgTAP security acceptance
        run: npx --yes supabase@2.115.0 test db --workdir .tmp/supabase-rls-acceptance

      # The other half of the tenancy proof. pgTAP settles what the database
      # refuses; this settles whether a person can use the product sitting on
      # it, and whether what the policies decided is what reaches the screen.
      # It runs in this job because the stack it needs is already up.
      # No schema step: `supabase start` already applied the generated fragments,
      # because `acceptance:supabase-rls:prepare` writes them into this
      # project's migrations before the stack comes up. Applying them again
      # fails on the first `create policy`, which has no `if not exists`.
      - name: Seed deterministic tenants and identities
        run: |
          SERVICE_KEY="$(npx --yes supabase@2.115.0 status --workdir .tmp/supabase-rls-acceptance -o json | jq -r '.SERVICE_ROLE_KEY')"
          node tooling/seed-records-journey.mjs --url http://127.0.0.1:54321 --service-key "$SERVICE_KEY"

      # The half of the boundary SQL cannot reach. A real Supabase deployment
      # forbids direct DELETE and UPDATE on storage.objects, so the remove
      # boundary and the role distinction are proved against the Storage HTTP
      # API with real per-identity tokens.
      - name: Storage API boundary acceptance
        run: |
          STATUS="$(npx --yes supabase@2.115.0 status --workdir .tmp/supabase-rls-acceptance -o json)"
          node tooling/storage-boundary-acceptance.mjs \
            --url http://127.0.0.1:54321 \
            --anon-key "$(jq -r '.ANON_KEY' <<<"$STATUS")" \
            --service-key "$(jq -r '.SERVICE_ROLE_KEY' <<<"$STATUS")"

      - run: npx playwright install --with-deps chromium

      - name: Generated-application records journey
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
        run: |
          export VITE_SUPABASE_PUBLISHABLE_KEY="$(npx --yes supabase@2.115.0 status --workdir .tmp/supabase-rls-acceptance -o json | jq -r '.ANON_KEY')"
          npm --prefix .tmp/generated-acceptance-b2b-saas install --no-audit --no-fund
          npm run test:e2e:generated-app

      - name: Publish generated-application journey evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generated-app-records-journey
          path: test-results
          if-no-files-found: warn
          retention-days: 14
