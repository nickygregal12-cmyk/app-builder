name: PR CI Dispatcher

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# This workflow deliberately never checks out or executes pull-request code.
# It only dispatches the ordinary read-only CI workflow against same-repository
# PR branches, so automated PR updates cannot leave required CI unscheduled.
permissions:
  actions: write
  contents: read

concurrency:
  group: pr-ci-dispatch-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dispatch:
    # Never dispatch arbitrary refs from forks. External/fork PRs continue to use
    # the ordinary pull_request CI path and GitHub's normal fork protections.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch CI for PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$PR_HEAD_REF"
