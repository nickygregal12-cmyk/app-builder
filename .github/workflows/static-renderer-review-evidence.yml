name: Static Renderer Review Evidence

on:
  pull_request:
    paths:
      - '.github/workflows/static-renderer-review-evidence.yml'
      - 'tooling/static-renderer-acceptance.mjs'
      - 'templates/astro-static-content/**'
      - 'config/renderers.json'

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Generate static renderer review evidence
        run: npm run acceptance:static-renderer -- --direction structured-practice

      - name: Upload detached static-renderer review evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: static-renderer-review-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .app-builder/static-renderer/report.json
            .app-builder/static-renderer/service/**/captures/*.png
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
