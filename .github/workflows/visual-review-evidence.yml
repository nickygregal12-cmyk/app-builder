name: Visual Review Evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/visual-review-evidence.yml'
      - 'tooling/visual-candidate-acceptance.mjs'
      - 'tooling/lib/visual-review-report.mjs'
      - 'apps/service/src/visual-candidates.js'
      - 'templates/react-vite-neutral/**'
      - 'config/visual-directions.json'
      - 'examples/genuine-business/nbm-approved-intake.v1.json'

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium

      - name: Generate genuine-business visual review evidence
        run: npm run acceptance:visual-candidates

      - name: Upload detached review evidence only
        uses: actions/upload-artifact@v4
        with:
          name: nbm-visual-review-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .app-builder/visual-review/report.json
            .app-builder/visual-review/review-packets.json
            .app-builder/visual-review/service/**/captures/*.png
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
