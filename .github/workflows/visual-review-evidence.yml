name: Visual Review Evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/visual-review-evidence.yml'
      - 'tooling/visual-candidate-acceptance.mjs'
      - 'tooling/lib/visual-review-report.mjs'
      - 'apps/service/src/visual-candidates.js'
      - 'templates/react-vite-neutral/**'
      - 'config/visual-directions.json'
      - 'examples/genuine-business/nbm-approved-intake.v1.json'

permissions:
  contents: read

# Evidence is tied to one exact head. A newer commit makes an in-flight capture
# obsolete, so do not finish building and uploading screenshots nobody should
# review. Manual runs keep unique groups and are never cancelled by a PR update.
concurrency:
  group: visual-review-evidence-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium

      - name: Generate genuine-business visual review evidence
        run: npm run acceptance:visual-candidates

      - name: Upload detached review evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nbm-visual-review-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .app-builder/visual-review/report.json
            .app-builder/visual-review/review-packets.json
            .app-builder/visual-review/service/**/captures/*.png
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
